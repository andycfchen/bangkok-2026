*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:hidden;

header.top{text-align:center;padding:22px 0 8px}

nav.tabs{scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:2px dashed var(--line);display:flex;gap:8px;overflow-x:auto}

section.blk{margin-top:26px}
.board{background:var(--paper);border:3px solid var(--ink);border-radius:22px 28px 20px 26px;padding:16px;box-shadow:4px 5px 0 var(--shadow);position:relative}
.board h2{margin:0 0 4px;font-size:20px}
.board h2 .tp{display:inline-block;background:var(--tape);padding:1px 10px;transform:rotate(-1.5deg);border-radius:3px}
.note{font-size:13px;color:var(--sub)}

.stk{width:48px;height:48px;flex:0 0 auto;overflow:visible;filter:drop-shadow(1px 2px 0 var(--shadow))}
.hero{display:flex;align-items:center;justify-content:center;gap:6px}

.hero .stk{width:clamp(38px,11vw,72px);height:clamp(38px,11vw,72px)}
.hero .hl{transform:rotate(-8deg)}.hero .hr{transform:rotate(8deg)}
.dcard .cs{position:absolute;top:-16px;right:-6px;width:42px;height:42px;transform:rotate(10deg);z-index:2}
.stay .ds-s{margin-left:auto;width:46px;height:46px;margin-top:-18px;transform:rotate(6deg)}
.fstk{display:flex;justify-content:center;gap:12px;margin-bottom:8px}
.fstk .stk{width:40px;height:40px}.fstk .stk:nth-child(even){transform:rotate(-8deg)}.fstk .stk:nth-child(odd){transform:rotate(7deg)}
.pw-m{display:none}
@media(max-width:640px){.pw-d{display:none}.pw-m{display:block}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px 14px;margin-top:20px}
.dcard{display:block;text-decoration:none;background:#fff;border:2px solid var(--ink);padding:8px 8px 10px;border-radius:6px;box-shadow:3px 4px 0 var(--shadow);position:relative;transition:transform .15s}
.dcard:nth-child(odd){transform:rotate(-1.2deg)}.dcard:nth-child(even){transform:rotate(1deg)}
.dcard:hover,.dcard:focus-visible{transform:rotate(0) translateY(-3px)}
.dcard:before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:16px;margin-left:-27px;background:var(--tape);opacity:.85;transform:rotate(-3deg)}
.dcard .ph{height:92px;border-radius:4px;background:var(--accent) center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden}

.dayhead.cover{text-shadow:0 1px 3px rgba(0,0,0,.6)}

.tag.warn{color:var(--warn);background:#fff0e3}
.tag.must{color:#b91c1c;background:#fde8e8}
.price{color:#8a5a00;background:#fff3cf;border-radius:8px;padding:1px 8px;display:inline-block;margin-top:4px}
.tix{font-size:12.5px;margin-top:4px;background:#eef6ff;border-radius:8px;padding:2px 8px;color:#1f4d7a}
details.hr,details.bk{margin-top:5px;font-size:12.5px}
details summary{cursor:pointer;font-weight:700;color:var(--sub)}
details.hr.warn summary{color:var(--warn)}details.hr.ok summary{color:var(--okc)}
details>div{margin-top:3px;color:var(--ink);background:var(--bg);border-radius:8px;padding:5px 8px}
.maps{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.maps:empty{display:none}
.chip{font-size:12px;text-decoration:none;border:1.5px solid var(--ink);border-radius:999px;padding:0 9px;background:var(--soft);line-height:1.7}
.pic{display:block;max-width:100%;max-height:210px;border-radius:8px;margin-top:6px;border:2px solid var(--ink);object-fit:cover}
figure.x{margin:6px 0 0}figure.x figcaption{font-size:11.5px;color:var(--sub)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.rc{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;box-shadow:2px 2px 0 var(--shadow);font-size:13.5px}
.rc b{font-size:15px}.rc .d{color:var(--sub);font-size:12.5px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:10px}
.tips ul{margin:4px 0 0;padding-left:20px;font-size:14px}
.tips li{margin:3px 0}
.chk{list-style:none;padding:0!important}
.chk label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:5px;accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto}
.chk input:checked+span{text-decoration:line-through;color:var(--sub)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{border:1.5px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
footer{margin-top:30px;font-size:12.5px;color:var(--sub);text-align:center;border-top:2px dashed var(--line);padding-top:14px}
#err{display:none;background:#fde8e8;border:2px solid #b91c1c;border-radius:12px;padding:12px;margin-top:16px}
@media(max-width:520px){
 .hero h1{font-size:21px;white-space:nowrap}
 .hero .stk{width:36px;height:36px}
 ol.tl li{grid-template-columns:54px 1fr;gap:0 28px}

 .dayhead .ic{width:48px}
 .dayhead .no{width:44px;height:44px;font-size:28px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.dcard,.nd circle{transition:none}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 主題 ---------- */
const root=document.documentElement;
function setTheme(t){
 if(t==='gold')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);
 document.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===t)));
 try{localStorage.setItem('bkk-journal-theme',t)}catch(e){}
}
let th='gold';try{th=localStorage.getItem('bkk-journal-theme')||'gold'}catch(e){}
if(!['gold','siam','river'].includes(th))th='gold';
setTheme(th);
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));

/* ---------- 曼谷時間 UTC+7 ---------- */
const fmt=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Bangkok',hour12:false,month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
function tick(){const p={};fmt.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);

 /* 每日 */
 const dayHtml=d=>{
  const stops=stopsOf(d);
  const N=stops.length,H=60+N*84;
  const pos=i=>[i%2?270:90,50+i*84];
  const segLabel=i=>{ // 兩個站之間的交通
   const a=stops[i],b=stops[i+1];if(b-a<2)return '';
   const mv=d.items.slice(a+1,b).filter(x=>x[2]==='move');if(!mv.length)return '';
   const txt=mv.map(x=>(x[3]||'')+' '+x[1]).join(' ');
   const km=txt.match(/約 ?(\d+(?:\.\d+)?) ?公里/),mn=txt.match(/約 ?(\d+(?:[–-]\d+)?) ?分/),hr=txt.match(/約 ?(\d+(?:[–-]\d+)?) ?小時/);
   const parts=[];if(km)parts.push('約 '+km[1]+' km');if(mn)parts.push(mn[1]+' 分');else if(hr)parts.push(hr[1]+' 小時');
   return parts.length?parts.join('・'):'車程';
  };
  let path='',segs='',nodes='';
  stops.forEach((si,i)=>{
   const it=d.items[si],[x,y]=pos(i),k=it[2]||'rest';
   if(i<N-1){const [x2,y2]=pos(i+1);
    path+=`<path d="M${x} ${y}C${x} ${y+44} ${x2} ${y2-44} ${x2} ${y2}" fill="none" stroke="#8b5cf6" stroke-width="3.2" stroke-dasharray="7 6" stroke-linecap="round"/>`;
    const lb=segLabel(i);if(lb){const mx=(x+x2)/2,my=(y+y2)/2,w=lb.length*7.2+16;segs+=`<g><rect x="${mx-w/2}" y="${my-11}" width="${w}" height="22" rx="11" fill="#f3edff" stroke="#8b5cf6" stroke-width="1.8"/><text x="${mx}" y="${my+4.5}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b34c4">🚐 ${esc(lb)}</text></g>`}}
   const left=i%2===0,tx=left?x+32:x-32,an=left?'start':'end';
   nodes+=`<g class="nd" data-i="${si}" tabindex="0" role="button" aria-label="${esc(it[0]+' '+it[1])}"><circle class="c" cx="${x}" cy="${y}" r="24" fill="${kcol[k]||kcol.rest}" stroke="#3b2f1e" stroke-width="3"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="20">${kindIcon(k,it[1])}</text><text x="${tx}" y="${y-3}" text-anchor="${an}" font-size="11.5" fill="#7a6a4f" font-weight="700">${esc(trunc(it[0],12))}</text><text x="${tx}" y="${y+14}" text-anchor="${an}" font-size="13" font-weight="800" fill="#3b2f1e">${esc(nameOf(it))}</text></g>`;
  });
  const svg=`<svg viewBox="0 0 360 ${H}" role="img" aria-label="Day ${d.no} 示意路線圖">${path}${segs}${nodes}<g id="mk-${d.no}" class="mk" style="transition:transform .8s ease;transform:translate(${pos(0)[0]}px,${pos(0)[1]-38}px)"><use href="#stk-elephant" x="-18" y="-34" width="36" height="36"/></g></svg>`;
  // 整天 Google 地圖路線
  const names=[];d.items.forEach(it=>{if(it[2]==='move')return;const h=find(PL,it[1]);if(h&&h[1].length)names.push(h[1][0])});
  const uniq=names.filter((n,i)=>names.indexOf(n)===i);
  const city=d.no===2?' Pattaya':' Bangkok';
  const q=n=>mapUrl(n,d.no).split('query=')[1]||encodeURIComponent(n+city);
  let gm='';
  if(uniq.length>=2){const w=uniq.slice(1,-1).slice(0,9).map(q).join('%7C');
   gm=`<a class="gm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${q(uniq[0])}&destination=${q(uniq[uniq.length-1])}${w?'&waypoints='+w:''}&travelmode=driving">📍 整天路線（Google 地圖）</a>`}
  const li=d.items.map(([t,title,k,n,link,w],ix)=>{
   const mv=k==='move';
   const chips=(()=>{const h=find(PL,title);if(h)return h[1].map(nm=>`<a class="chip" href="${esc(mapUrl(nm,d.no))}" target="_blank" rel="noopener">📍 ${esc(nm)}</a>`).join('');
     return link?`<a class="chip" href="${esc(link)}" target="_blank" rel="noopener">📍 Google 地圖</a>`:''})();
   const nor=find(NORSV,title),pr=find(PRICE,title),hr=find(HOURS,title),tx=find(TIX,title);
   const bkk=Object.keys(BACKUP).find(x=>title.includes(x));
   const bk=bkk?`<details class="bk"><summary>備案（${BACKUP[bkk].length}）</summary>${(BKIMG[bkk]?`<figure class="x"><img class="pic" loading="lazy" referrerpolicy="no-referrer" alt="${esc(BKIMG[bkk].cap)}" src="${esc(BKIMG[bkk].src)}"><figcaption>${esc(BKIMG[bkk].cap)}</figcaption></figure>`:'')}${BACKUP[bkk].map((x,i)=>`<div>${esc(x)}${((BKPLACE[bkk]||[])[i]||[]).length?`<div class="maps">${BKPLACE[bkk][i].map(nm=>`<a class="chip" href="${esc(mapUrl(nm,0))}" target="_blank" rel="noopener">📍 ${esc(nm)}</a>`).join('')}</div>`:''}</div>`).join('')}</details>`:'';
   const pu=mv?'':picOf(title),ex=mv?'':(()=>{const k2=Object.keys(EXTRA).find(x=>title.includes(x));return k2?EXTRA[k2].map(([c,u])=>`<figure class="x"><img class="pic" loading="lazy" referrerpolicy="no-referrer" alt="${esc(c)}" src="${esc(u)}"><figcaption>${esc(c)}</figcaption></figure>`).join(''):''})();
   return `<li id="it-${d.no}-${ix}" class="${esc(k||'rest')}${mv?' mv':''}" data-i="${ix}"><div class="t">${esc(t)}</div><div class="what"><strong>${esc(title)}</strong>${nor?`<span class="tag nor">${esc(nor[1])}</span>`:''}${w?'<span class="tag warn">待確認</span>':''}${n?`<div class="n">${esc(n)}</div>`:''}${w?`<div class="n" style="color:var(--warn)">${esc(w)}</div>`:''}${(!mv&&pr)?`<div class="price">每人均價：${esc(pr[1])}</div>`:''}${tx?`<div class="tix">🎫 ${esc(tx[1])}</div>`:''}${hr?`<details class="hr ${esc(hr[1])}"><summary>🕘 ${esc(HLAB[hr[1]])}</summary><div>${esc(hr[2])}</div></details>`:''}${bk}${chips?`<div class="maps">${chips}</div>`:''}${pu?`<a href="${esc(pu)}" target="_blank" rel="noopener"><img class="pic" loading="lazy" referrerpolicy="no-referrer" alt="${esc(title)}" src="${esc(pu)}"></a>`:''}${ex}</div></li>`}).join('');
  const cover=DAYPIC[d.no];
  return `<section class="blk day" id="day${d.no}" data-no="${d.no}"><div class="dayhead${cover?' cover':''}"${cover?` style="background-image:linear-gradient(90deg,rgba(20,14,4,.78),rgba(20,14,4,.2)),url('${esc(cover)}')"`:''}><div class="no">${d.no}</div><div><div class="meta">${esc(d.date)}（${esc(d.wd)}）</div><h2>${esc(d.title)}</h2></div><div class="ic">${ICON[d.svg]||''}</div></div>
  <div class="stay">${d.stay.map(s=>`<span>${esc(s)}</span>`).join('')}${stk(['cat','mango','elephant','tea','tuktuk','cat'][d.no-1],'ds-s')}</div>${d.note?`<div class="daynote">${esc(d.note)}</div>`:''}${HNOTE[d.no]?`<div class="hnote">📅 ${esc(HNOTE[d.no])}</div>`:''}
  <div class="daygrid"><div class="mapcard"><div class="play"><button class="pbtn" data-play="${d.no}" aria-label="播放路線">▶</button><button class="pbtn" data-spd="${d.no}" aria-label="播放速度">×1</button><div class="cap" id="cap-${d.no}">按 ▶ 讓小象走一遍今天</div></div>${svg}<div id="legend"><i style="background:var(--eat)"></i>吃<i style="background:var(--go)"></i>逛<i style="background:var(--rest)"></i>休息<i style="background:var(--move)"></i>交通</div>${gm}<div class="note" style="margin-top:6px">✦ 地圖為示意圖，不照比例；交通距離、時間來自行程備註（多為估計）。</div></div>
  <ol class="tl">${li}</ol></div></section>`;
 };
 html+=D.map(dayHtml).join('');

 /* 重點預約 + 貼心提醒 + 清單 */
 html+=`<section class="blk" id="tips"><div class="board"><h2><span class="tp">📌 重點預約</span></h2><div class="note">同步自主網頁的預約清單，不能預約的店已在每天時間軸標「不訂位」。</div><div class="res">${RES.map(r=>`<div class="rc"><span class="tag ${r[0]==='極高'?'must':r[0]==='高'?'warn':''}" style="margin:0 6px 0 0">${esc(r[0])}</span><b>${esc(r[1])}</b><div class="d">${esc(r[2])}</div><div>${esc(r[3])}</div><div class="d">${esc(r[4])}</div></div>`).join('')}</div></div></section>`;
 const flights=D.filter(d=>d.stay&&d.stay[0]&&/^✈/.test(d.stay[0])).map(d=>d.stay[0].replace(/^✈\s*/,'')).join('；');
 const tipsL=['12/07 是泰國補假日、12/10 是憲法日，政府機關與銀行休息，店家營業時間出發前一週再看 IG／Google 地圖。','鄭王廟、真理寺要遮肩遮膝；渡船與廟門票多半只收現金，小鈔零錢要帶。','Dib Bangkok 只收信用卡或轉帳；RONGROS、Dib 預約要提早。','市區移動以 Grab／私人車為主，傍晚塞車，行程裡的車程多為估計，請多留緩衝。','機場接送、飯店與預約資訊在主網頁每天的卡片裡。'];
 const chk=['護照（確認效期）與入境規定，請查官方最新公告','機票／登機資訊：'+(flights||'CI837、CI832'),'泰銖現金（含小鈔）、可用的信用卡','網路：eSIM 或漫遊','Grab、Google 地圖離線地圖','轉接插頭、行動電源（隨身行李）','防曬、遮肩遮膝的衣物（寺廟用）','雨具與好走的鞋','旅平險、緊急聯絡資料備份','出發前確認所有預約（見上方「重點預約」）','12/09 泰服店位置與價格確認','Pokémon Center 開幕日出發前再查'];
 let saved={};try{saved=JSON.parse(localStorage.getItem('bkk-journal-chk')||'{}')}catch(e){}
 html+=`<section class="blk" id="prep"><div class="board"><h2><span class="tp">💡 貼心提醒 (Tips)＆出發前清單</span></h2><div class="tips"><div><b>貼心提醒</b><ul>${tipsL.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><b>出發前清單</b>（勾選會存在這台裝置）<ul class="chk">${chk.map((x,i)=>`<li><label><input type="checkbox" data-c="${i}"${saved[i]?' checked':''}><span>${esc(x)}</span></label></li>`).join('')}</ul></div></div></div></section>`;
 if(ALT&&ALT.length)html+=`<section class="blk"><div class="board"><details><summary style="font-size:16px">🧭 備選地點（原行程表有、目前沒排）</summary><div class="tbl" style="margin-top:8px"><table><thead><tr><th>地點</th><th>位置</th><th>營業時間</th><th>備註</th></tr></thead><tbody>${ALT.map(r=>`<tr>${r.map((c,i)=>`<td>${i?'':'<strong>'}${esc(c)}${i?'':'</strong>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div></section>`;
 $('#main').innerHTML=html;

 /* 卡片圖片載入失敗就回到插圖底色 */
 document.querySelectorAll('.pic').forEach(im=>im.addEventListener('error',()=>{im.style.display='none'}));
 document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{saved[c.dataset.c]=c.checked;try{localStorage.setItem('bkk-journal-chk',JSON.stringify(saved))}catch(e){}});

 /* 播放 */
 const speeds=[1,2,4];const st={};
 D.forEach(d=>{
  const stops=stopsOf(d);const no=d.no;st[no]={spd:0,timer:null,cur:-1};
  const mk=$('#mk-'+no),cap=$('#cap-'+no),sec=$('#day'+no);
  const posOf=i=>[i%2?270:90,50+i*84];
  const show=n=>{const s=st[no];s.cur=n;const si=stops[n],it=d.items[si],[x,y]=posOf(n);
   mk.style.transform=`translate(${x}px,${y-38}px)`;
   sec.querySelectorAll('.nd').forEach(e=>e.classList.toggle('cur',+e.dataset.i===si));
   sec.querySelectorAll('ol.tl li').forEach(e=>e.classList.toggle('cur',+e.dataset.i===si));
   cap.textContent=`${it[0]}　${it[1]}`};
  const stop=()=>{clearInterval(st[no].timer);st[no].timer=null;sec.querySelector('[data-play]').textContent='▶'};
  const step=()=>{let n=st[no].cur+1;if(n>=stops.length){stop();return}show(n)};
  const start=()=>{if(st[no].cur>=stops.length-1)st[no].cur=-1;step();clearInterval(st[no].timer);st[no].timer=setInterval(step,2000/speeds[st[no].spd]);sec.querySelector('[data-play]').textContent='⏸'};
  sec.querySelector('[data-play]').onclick=()=>st[no].timer?stop():start();
  sec.querySelector('[data-spd]').onclick=e=>{const s=st[no];s.spd=(s.spd+1)%3;e.target.textContent='×'+speeds[s.spd];if(s.timer){clearInterval(s.timer);s.timer=setInterval(step,2000/speeds[s.spd])}};
  sec.querySelectorAll('.nd').forEach(e=>{const go=()=>{const si=+e.dataset.i;stop();const n=stops.indexOf(si);show(n);const li=document.getElementById(`it-${no}-${si}`);if(li)li.scrollIntoView({block:'center',behavior:'smooth'})};e.onclick=go;e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}}});
 });

 /* 導覽列高亮 */
 const links=[...tabs.querySelectorAll('a')];
 const secs=[$('#overview'),...document.querySelectorAll('.day')];
 const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id='#'+e.target.id;links.forEach(a=>{const on=a.getAttribute('href')===id;a.classList.toggle('on',on);if(on)tabs.scrollTo({left:a.offsetLeft-16,behavior:'smooth'})})}})},{rootMargin:'-30% 0px -60% 0px'});
 secs.forEach(s=>s&&io.observe(s));
 if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)setTimeout(()=>t.scrollIntoView(),50)}
}
})();
</script>
</body>
</html>
